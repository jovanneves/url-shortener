user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    
    # Compressão gzip para melhorar performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Configuração do proxy reverso para o URL Shortener
    server {
        listen 80;
        server_name urlshortener;

        # Tamanho máximo do corpo da requisição
        client_max_body_size 10M;

        # Configuração do proxy
        location / {
            proxy_pass http://app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
        }

        # Configuração para arquivos estáticos
        location /static/ {
            proxy_pass http://app:3000/static/;
            proxy_cache_valid 200 30d;
            add_header Cache-Control "public, max-age=2592000";
            expires 30d;
        }

        # Configuração para imagens
        location ~* \.(jpg|jpeg|png|gif|ico|svg)$ {
            proxy_pass http://app:3000;
            proxy_cache_valid 200 30d;
            add_header Cache-Control "public, max-age=2592000";
            expires 30d;
        }

        # Configuração para outros arquivos estáticos
        location ~* \.(css|js)$ {
            proxy_pass http://app:3000;
            proxy_cache_valid 200 7d;
            add_header Cache-Control "public, max-age=604800";
            expires 7d;
        }
    }
} 