version: '3'

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb-urlshortener
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mongodb_data:/data/db
    networks:
      - url-shortener-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: url-shortener-app
    expose:
      - "3000"
    environment:
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/urlshortener?authSource=admin
      - REDIS_URL=redis://localhost:6379
      - NEXTAUTH_URL=http://urlshortener
      - NEXTAUTH_SECRET=your_nextauth_secret_key
      - ADMIN_EMAIL=admin@sistema.com
      - ADMIN_PASSWORD=@dm1n
      - NEXT_PUBLIC_APP_URL=http://urlshortener
    depends_on:
      - mongodb
    networks:
      - url-shortener-network
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx.Dockerfile
    container_name: url-shortener-nginx
    ports:
      - "80:80"
    depends_on:
      - app
    networks:
      - url-shortener-network
    restart: unless-stopped

networks:
  url-shortener-network:
    driver: bridge

volumes:
  mongodb_data: 